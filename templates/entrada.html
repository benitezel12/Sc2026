{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-start mb-3">
  <div>
    <h2 class="mb-1">🎟️ Control de entrada</h2>
    <p class="text-muted mb-0">Validación de boletas de San Compartiendo 2026.</p>
  </div>
  <a class="btn btn-outline-secondary btn-sm" href="javascript:history.back()">Volver</a>
</div>

<div id="entryKpis" class="row g-2 mb-4"></div>

<div class="card p-3 mb-3 shadow-sm">
  <button class="btn btn-primary btn-lg py-3 w-100" onclick="iniciarScannerEntrada()">📷 Escanear QR de la boleta</button>
  <div id="entryScanPanel" class="mt-3 d-none">
    <div id="entryReader"></div>
    <button class="btn btn-outline-secondary w-100 mt-2" onclick="cerrarScannerEntrada()">Cerrar cámara</button>
  </div>
</div>

<div class="card p-3 mb-3 shadow-sm">
  <label class="form-label fw-bold">Validación manual por número</label>
  <div class="input-group input-group-lg">
    <input id="entryNumero" class="form-control" inputmode="numeric" autocomplete="off" placeholder="Ej. 25 o 0025" onkeydown="if(event.key==='Enter')validarEntradaManual()">
    <button class="btn btn-outline-primary" onclick="validarEntradaManual()">Validar</button>
  </div>
  <div class="small text-muted mt-2">Utilizar solo cuando no sea posible leer el QR.</div>
</div>

<div id="entryResult"></div>
{% endblock %}
{% block scripts %}
<script src="https://unpkg.com/html5-qrcode"></script>
<script>loadEntrada()</script>
{% endblock %}
